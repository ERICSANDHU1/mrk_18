<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', sans-serif">
  <defs>
    <radialGradient id="bgE2" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#102540"/>
      <stop offset="100%" stop-color="#08111d"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bgE2)"/>

  <!-- title -->
  <text x="540" y="78" text-anchor="middle" font-size="48" font-weight="bold" fill="#e8eff7">Generic AI Writer vs AI CMO</text>
  <text x="540" y="128" text-anchor="middle" font-size="23" fill="#8aa0b4">A chatbot writes the tweet. An agent decides whether to post it —</text>
  <text x="540" y="158" text-anchor="middle" font-size="23" fill="#8aa0b4">ships it, then checks if it actually worked.</text>

  <!-- column headers -->
  <text x="300" y="232" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#8aa0b4" letter-spacing="1">AI WRITER (CHATBOT)</text>
  <text x="788" y="232" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#6fd3e6" letter-spacing="1">AI CMO AGENT</text>
  <line x1="540" y1="258" x2="540" y2="1180" stroke="#21405f" stroke-width="2"/>

  <!-- rows -->
  <!-- row 1 -->
  <text x="70" y="318" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="318" font-size="23" fill="#9fb0c0">Responds — waits for a prompt</text>
  <text x="566" y="318" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="318" font-size="23" font-weight="bold" fill="#e8eff7">Acts — perceive → decide → execute</text>
  <line x1="70" y1="350" x2="1010" y2="350" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 2 -->
  <text x="70" y="410" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="410" font-size="23" fill="#9fb0c0">Stateless — forgets you</text>
  <text x="566" y="410" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="410" font-size="23" font-weight="bold" fill="#e8eff7">Remembers brand, funnel, campaigns</text>
  <line x1="70" y1="442" x2="1010" y2="442" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 3 -->
  <text x="70" y="502" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="502" font-size="23" fill="#9fb0c0">Single prompt, single reply</text>
  <text x="566" y="502" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="502" font-size="23" font-weight="bold" fill="#e8eff7">Orchestrated multi-step workflow</text>
  <line x1="70" y1="534" x2="1010" y2="534" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 4 -->
  <text x="70" y="594" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="594" font-size="23" fill="#9fb0c0">Generates text on a screen</text>
  <text x="566" y="594" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="594" font-size="23" font-weight="bold" fill="#e8eff7">Takes action across your channels</text>
  <line x1="70" y1="626" x2="1010" y2="626" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 5 -->
  <text x="70" y="686" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="686" font-size="23" fill="#9fb0c0">Guesses from what you paste</text>
  <text x="566" y="686" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="686" font-size="23" font-weight="bold" fill="#e8eff7">Reads your real numbers (MCP)</text>
  <line x1="70" y1="718" x2="1010" y2="718" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 6 -->
  <text x="70" y="778" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="778" font-size="23" fill="#9fb0c0">No feedback loop</text>
  <text x="566" y="778" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="778" font-size="23" font-weight="bold" fill="#e8eff7">Evaluates results &amp; self-corrects</text>
  <line x1="70" y1="810" x2="1010" y2="810" stroke="#162c44" stroke-width="1.5"/>
  <!-- row 7 -->
  <text x="70" y="870" font-size="26" fill="#ff6b6b">✗</text>
  <text x="110" y="870" font-size="23" fill="#9fb0c0">Static until you re-prompt</text>
  <text x="566" y="870" font-size="26" fill="#3fd98a">✓</text>
  <text x="606" y="870" font-size="23" font-weight="bold" fill="#e8eff7">Compounds with every campaign</text>

  <!-- bottom note -->
  <rect x="70" y="950" width="940" height="170" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
  <text x="540" y="1012" text-anchor="middle" font-size="24" font-weight="bold" fill="#6fd3e6">The chatbot isn't the enemy.</text>
  <text x="540" y="1052" text-anchor="middle" font-size="21" fill="#9fb0c0">An AI CMO contains a writer — then adds memory, tools,</text>
  <text x="540" y="1082" text-anchor="middle" font-size="21" fill="#9fb0c0">orchestration and evaluation around it.</text>

  <!-- footer -->
  <line x1="60" y1="1238" x2="1020" y2="1238" stroke="#21405f" stroke-width="1.5"/>
  <text x="60" y="1285" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#6fd3e6">mrk18</text>
  <text x="205" y="1285" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#7e93a6">building an AI CMO</text>
  <text x="1020" y="1285" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#7e93a6">@eric-sandhu · save this ↗</text>
</svg>
