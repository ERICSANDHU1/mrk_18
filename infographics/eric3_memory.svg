<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', sans-serif">
  <defs>
    <radialGradient id="bgE3" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#102540"/>
      <stop offset="100%" stop-color="#08111d"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bgE3)"/>

  <text x="540" y="76" text-anchor="middle" font-size="46" font-weight="bold" fill="#e8eff7">How an AI CMO Remembers Your Brand</text>
  <text x="540" y="124" text-anchor="middle" font-size="23" fill="#8aa0b4">Four kinds of memory — plus the engine that keeps them current.</text>
  <line x1="60" y1="150" x2="1020" y2="150" stroke="#21405f" stroke-width="1.5"/>

  <!-- 7 rows -->
  <!-- row helper: rect, number, label, desc, flow -->
  <g>
    <rect x="60" y="168" width="960" height="146" rx="14" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <text x="96" y="258" font-size="64" font-weight="bold" fill="#1c3e5c">01</text>
    <text x="210" y="222" font-size="27" font-weight="bold" fill="#e8eff7">Working Memory</text>
    <text x="210" y="256" font-size="19" fill="#9fb0c0">The live scratchpad — this session's context and task state.</text>
    <text x="210" y="290" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">task in → reason → act → discard</text>
  </g>
  <g>
    <rect x="60" y="322" width="960" height="146" rx="14" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <text x="96" y="412" font-size="64" font-weight="bold" fill="#1c3e5c">02</text>
    <text x="210" y="376" font-size="27" font-weight="bold" fill="#e8eff7">Semantic Memory — what your brand IS</text>
    <text x="210" y="410" font-size="19" fill="#9fb0c0">Durable facts: positioning, ICP, tone, product, pricing.</text>
    <text x="210" y="444" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">retrieve by relevance → grounds every output</text>
  </g>
  <g>
    <rect x="60" y="476" width="960" height="146" rx="14" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <text x="96" y="566" font-size="64" font-weight="bold" fill="#1c3e5c">03</text>
    <text x="210" y="530" font-size="27" font-weight="bold" fill="#e8eff7">Episodic Memory — what HAPPENED</text>
    <text x="210" y="564" font-size="19" fill="#9fb0c0">Past campaigns and results: what won, what leaked money.</text>
    <text x="210" y="598" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">retrieve by recency → "we tried this before"</text>
  </g>
  <g>
    <rect x="60" y="630" width="960" height="146" rx="14" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <text x="96" y="720" font-size="64" font-weight="bold" fill="#1c3e5c">04</text>
    <text x="210" y="684" font-size="27" font-weight="bold" fill="#e8eff7">Procedural Memory — how to DO the work</text>
    <text x="210" y="718" font-size="19" fill="#9fb0c0">Marketing playbooks the agent runs step by step.</text>
    <text x="210" y="752" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">match goal → run the recipe</text>
  </g>
  <g>
    <rect x="60" y="784" width="960" height="146" rx="14" fill="#0c1d30" stroke="#2a4f73" stroke-width="1.5"/>
    <text x="96" y="874" font-size="64" font-weight="bold" fill="#1c3e5c">05</text>
    <text x="210" y="838" font-size="27" font-weight="bold" fill="#9fd8ea">Retrieval Layer (RAG)</text>
    <text x="210" y="872" font-size="19" fill="#9fb0c0">Fetches the right memory at the right time.</text>
    <text x="210" y="906" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">query → embed → search → inject</text>
  </g>
  <g>
    <rect x="60" y="938" width="960" height="146" rx="14" fill="#0c1d30" stroke="#2a4f73" stroke-width="1.5"/>
    <text x="96" y="1028" font-size="64" font-weight="bold" fill="#1c3e5c">06</text>
    <text x="210" y="992" font-size="27" font-weight="bold" fill="#9fd8ea">Consolidation / Write-back</text>
    <text x="210" y="1026" font-size="19" fill="#9fb0c0">Turns each run into new long-term memory.</text>
    <text x="210" y="1060" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">session ends → summarize → persist</text>
  </g>
  <g>
    <rect x="60" y="1092" width="960" height="146" rx="14" fill="#0c1d30" stroke="#2a4f73" stroke-width="1.5"/>
    <text x="96" y="1182" font-size="64" font-weight="bold" fill="#1c3e5c">07</text>
    <text x="210" y="1146" font-size="27" font-weight="bold" fill="#9fd8ea">Forgetting / Decay</text>
    <text x="210" y="1180" font-size="19" fill="#9fb0c0">Prunes stale or contradicted facts so old data can't poison new calls.</text>
    <text x="210" y="1214" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#6fd3e6">age / conflict check → prune or refresh</text>
  </g>

  <!-- footer -->
  <text x="60" y="1290" font-family="'DejaVu Sans Mono', monospace" font-size="19" fill="#7e93a6">Each layer needs its own retrieval strategy — that's the hard part.</text>
  <text x="1020" y="1290" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="19" fill="#6fd3e6">mrk18 · @eric-sandhu</text>
</svg>
