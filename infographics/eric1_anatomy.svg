<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', sans-serif">
  <defs>
    <radialGradient id="bgE1" cx="30%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#102540"/>
      <stop offset="100%" stop-color="#08111d"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bgE1)"/>

  <!-- title -->
  <text x="540" y="74" text-anchor="middle" font-size="50" font-weight="bold" fill="#e8eff7">Anatomy of an AI CMO Agent</text>
  <text x="540" y="128" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="31" fill="#6fd3e6" letter-spacing="2">Agent  =  Model  +  Harness</text>
  <line x1="60" y1="162" x2="1020" y2="162" stroke="#21405f" stroke-width="1.5"/>

  <!-- concentric rings -->
  <circle cx="295" cy="760" r="252" fill="#0c1e30" stroke="#2a4f73" stroke-width="2"/>
  <circle cx="295" cy="760" r="172" fill="#102a42" stroke="#34618c" stroke-width="2"/>
  <circle cx="295" cy="760" r="102" fill="#16344f" stroke="#5b9bd5" stroke-width="2.5"/>

  <text x="295" y="548" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#6fd3e6" letter-spacing="2">THE HARNESS</text>
  <text x="295" y="622" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="19" fill="#8fb6d6">AGENT LOOP</text>
  <text x="295" y="755" text-anchor="middle" font-size="30" font-weight="bold" fill="#e8eff7">THE MODEL</text>
  <text x="295" y="788" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#8aa0b4">LLM reasoning core</text>

  <text x="295" y="1052" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="18" fill="#8aa0b4">You engineer the harness.</text>
  <text x="295" y="1080" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="18" fill="#8aa0b4">The model is swappable.</text>

  <!-- arrow to cards -->
  <line x1="552" y1="760" x2="528" y2="760" stroke="#5b9bd5" stroke-width="2"/>
  <path d="M552 752 L566 760 L552 768 Z" fill="#5b9bd5"/>

  <!-- component cards -->
  <!-- card template repeated -->
  <g>
    <rect x="588" y="200" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="245" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="253" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">1</text>
    <text x="668" y="240" font-size="25" font-weight="bold" fill="#e8eff7">Brand Guardrails</text>
    <text x="668" y="276" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Tone, claims, spend caps, and what</text>
    <text x="668" y="302" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">needs human sign-off.</text>
  </g>
  <g>
    <rect x="588" y="364" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="409" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="417" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">2</text>
    <text x="668" y="404" font-size="25" font-weight="bold" fill="#e8eff7">Playbooks (skills)</text>
    <text x="668" y="440" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Reusable marketing recipes,</text>
    <text x="668" y="466" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">encoded as repeatable procedures.</text>
  </g>
  <g>
    <rect x="588" y="528" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="573" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="581" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">3</text>
    <text x="668" y="568" font-size="25" font-weight="bold" fill="#e8eff7">Tools / MCP</text>
    <text x="668" y="604" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Live two-way links to ad platforms,</text>
    <text x="668" y="630" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">GA4, CRM, email and social.</text>
  </g>
  <g>
    <rect x="588" y="692" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="737" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="745" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">4</text>
    <text x="668" y="732" font-size="25" font-weight="bold" fill="#e8eff7">Memory</text>
    <text x="668" y="768" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Persistent brand + campaign history,</text>
    <text x="668" y="794" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">so it never restarts from zero.</text>
  </g>
  <g>
    <rect x="588" y="856" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="901" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="909" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">5</text>
    <text x="668" y="896" font-size="25" font-weight="bold" fill="#e8eff7">Evaluators / Critics</text>
    <text x="668" y="932" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Scores its own output and results,</text>
    <text x="668" y="958" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">catches errors, retries.</text>
  </g>
  <g>
    <rect x="588" y="1020" width="452" height="150" rx="16" fill="#0f2236" stroke="#21405f" stroke-width="1.5"/>
    <circle cx="628" cy="1065" r="22" fill="#15324f" stroke="#5b9bd5" stroke-width="2"/>
    <text x="628" y="1073" text-anchor="middle" font-size="22" font-weight="bold" fill="#6fd3e6">6</text>
    <text x="668" y="1060" font-size="25" font-weight="bold" fill="#e8eff7">Orchestration</text>
    <text x="668" y="1096" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">Routes work across sub-agents;</text>
    <text x="668" y="1122" font-family="'DejaVu Sans Mono', monospace" font-size="16.5" fill="#8aa0b4">decides human vs. auto.</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="1238" x2="1020" y2="1238" stroke="#21405f" stroke-width="1.5"/>
  <text x="60" y="1285" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#6fd3e6">mrk18</text>
  <text x="205" y="1285" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#7e93a6">building an AI CMO</text>
  <text x="1020" y="1285" text-anchor="end" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#7e93a6">@eric-sandhu · save this ↗</text>
</svg>
