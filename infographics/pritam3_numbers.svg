<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', sans-serif">
  <rect width="1080" height="1350" fill="#f3ede1"/>

  <text x="540" y="84" text-anchor="middle" font-size="39" font-weight="bold" fill="#22313f">6 Numbers Every Founder Should Know Cold</text>
  <text x="540" y="132" text-anchor="middle" font-size="24" fill="#717b85">Not to impress investors — to know if your growth actually works.</text>
  <line x1="70" y1="166" x2="1010" y2="166" stroke="#c8632a" stroke-width="3"/>

  <g>
    <rect x="70" y="200" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="273" r="30" fill="#c8632a"/>
    <text x="134" y="284" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <text x="190" y="258" font-size="28" font-weight="bold" fill="#22313f">CAC — Customer Acquisition Cost</text>
    <text x="190" y="298" font-size="19" fill="#717b85">What you spend on sales + marketing to win one new customer.</text>
    <rect x="700" y="306" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="327" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">only meaningful next to LTV</text>
  </g>
  <g>
    <rect x="70" y="354" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="427" r="30" fill="#c8632a"/>
    <text x="134" y="438" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <text x="190" y="412" font-size="28" font-weight="bold" fill="#22313f">LTV — Lifetime Value</text>
    <text x="190" y="452" font-size="19" fill="#717b85">Total profit one customer brings over the time they stay.</text>
    <rect x="700" y="460" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="481" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">aim for 3× your CAC or more</text>
  </g>
  <g>
    <rect x="70" y="508" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="581" r="30" fill="#c8632a"/>
    <text x="134" y="592" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    <text x="190" y="566" font-size="28" font-weight="bold" fill="#22313f">LTV : CAC Ratio</text>
    <text x="190" y="606" font-size="19" fill="#717b85">Whether a customer is worth more than they cost to win.</text>
    <rect x="700" y="614" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="635" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">3:1 minimum, 5:1+ is efficient</text>
  </g>
  <g>
    <rect x="70" y="662" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="735" r="30" fill="#c8632a"/>
    <text x="134" y="746" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">4</text>
    <text x="190" y="720" font-size="28" font-weight="bold" fill="#22313f">CAC Payback Period</text>
    <text x="190" y="760" font-size="19" fill="#717b85">Months of revenue to earn back what you spent acquiring a customer.</text>
    <rect x="700" y="768" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="789" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">under 12 months is the target</text>
  </g>
  <g>
    <rect x="70" y="816" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="889" r="30" fill="#c8632a"/>
    <text x="134" y="900" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">5</text>
    <text x="190" y="874" font-size="28" font-weight="bold" fill="#22313f">Activation Rate</text>
    <text x="190" y="914" font-size="19" fill="#717b85">% of new signups who reach the "aha moment" and get real value.</text>
    <rect x="700" y="922" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="943" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">40–60% is strong</text>
  </g>
  <g>
    <rect x="70" y="970" width="940" height="146" rx="14" fill="#fffdf7" stroke="#e6dcc9" stroke-width="1.5"/>
    <circle cx="134" cy="1043" r="30" fill="#c8632a"/>
    <text x="134" y="1054" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">6</text>
    <text x="190" y="1028" font-size="28" font-weight="bold" fill="#22313f">Churn Rate</text>
    <text x="190" y="1068" font-size="19" fill="#717b85">% of customers who leave in a period — the hole in the bucket.</text>
    <rect x="700" y="1076" width="290" height="30" rx="15" fill="#f6e3d4"/>
    <text x="845" y="1097" text-anchor="middle" font-size="16" font-weight="bold" fill="#b0552a">healthy SaaS aims &lt; 3–5% / mo</text>
  </g>

  <text x="70" y="1290" font-size="19" fill="#9a8a72">Benchmarks are directional — they shift by stage and source.</text>
  <text x="1010" y="1290" text-anchor="end" font-size="19" font-weight="bold" fill="#c8632a">mrk18 · @pritam-raj</text>
</svg>
