t-anchor="middle">you engineer the harness</text><line x1="556" y1="770" x2="523" y2="770" stroke="#0E7C66" stroke-width="3"/><path d="M522 763 L532 770 L522 777 Z" fill="#0E7C66"/><rect x="588" y="216" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="290" r="22" fill="#0E7C66"/><text x="630" y="298" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">1</text><text x="670" y="282" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Brand Guardrails</text><text x="670" y="314" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Tone, claims, spend caps, sign-off.</text><rect x="588" y="376" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="450" r="22" fill="#0E7C66"/><text x="630" y="458" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">2</text><text x="670" y="442" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Playbooks (skills)</text><text x="670" y="474" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Reusable marketing recipes.</text><rect x="588" y="537" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="611" r="22" fill="#0E7C66"/><text x="630" y="619" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">3</text><text x="670" y="603" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Tools / MCP</text><text x="670" y="635" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Live links to ads, GA4, CRM, email.</text><rect x="588" y="698" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx