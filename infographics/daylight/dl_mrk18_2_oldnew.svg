<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="42" fill="#1B2430" letter-spacing="-1">Founder Marketing: Old Way vs New Way</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">The problem was never effort — it was flying blind.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><rect x="60" y="208" width="470" height="742" rx="16" fill="#EEE9DD"/><rect x="550" y="208" width="470" height="742" rx="16" fill="#E7F0EC"/><text x="110" y="250" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#6B7682">OLD WAY</text><circle cx="92" cy="243" r="14" fill="none" stroke="#C0453B" stroke-width="2"/><line x1="86" y1="237" x2="98" y2="249" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="86" y1="249" x2="98" y2="237" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="600" y="250" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#0E7C66">NEW WAY</text><circle cx="582" cy="243" r="14" fill="none" stroke="#0E7C66" stroke-width="2"/><polyline points="576,243 580,248 591,235" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="88" y1="309" x2="104" y2="325" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="325" x2="104" y2="309" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="324" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Guessing from gut</text><polyline points="568,317 574,324 587,307" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="324" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Knowing from real numbers</text><line x1="88" y1="393" x2="104" y2="409" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="409" x2="104" y2="393" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="408" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Vanity dashboards of likes</text><polyline points="568,401 574,408 587,391" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="408" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">A weekly bitter-truth report</text><line x1="88" y1="477" x2="104" y2="493" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="493" x2="104" y2="477" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="492" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Strategy only in your head</text><polyline points="568,485 574,492 587,475" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="492" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Written down, watched, updated</text><line x1="88" y1="561" x2="104" y2="577" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="577" x2="104" y2="561" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="576" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">An agency you can't afford</text><polyline points="568,569 574,576 587,559" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="576" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Software at startup cost</text><line x1="88" y1="645" x2="104" y2="661" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="661" x2="104" y2="645" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="660" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Spotting a leak months late</text><polyline points="568,653 574,660 587,643" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="660" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Caught the week it starts</text><line x1="88" y1="729" x2="104" y2="745" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="745" x2="104" y2="729" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="744" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Stalls when you're heads-down</text><polyline points="568,737 574,744 587,727" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="744" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Keeps running while you build</text><line x1="88" y1="813" x2="104" y2="829" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="829" x2="104" y2="813" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="122" y="828" font-family="'Inter','sans-serif'" font-size="21" fill="#6B7682">Advice you execute alone</text><polyline points="568,821 574,828 587,811" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="828" font-family="'Inter','sans-serif'" font-weight="700" font-size="21" fill="#1B2430">Advice that comes with help</text><rect x="60" y="964" width="960" height="118" rx="16" fill="#EAF3EF" stroke="#0E7C66" stroke-width="1.5" filter="url(#cs)"/><text x="540" y="1012" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#0E7C66" text-anchor="middle">Same founder. Same effort.</text><text x="540" y="1050" font-family="'Inter','sans-serif'" font-size="20" fill="#46535F" text-anchor="middle">The only thing that changed is being able to see.</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@mrk18hq</text></svg>