<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="46" fill="#1B2430" letter-spacing="-1">Generic AI Writer vs AI CMO</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">A chatbot writes the tweet. An agent ships it — and checks if it worked.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><text x="300" y="216" font-family="'JetBrains Mono','monospace'" font-size="21" fill="#6B7682" text-anchor="middle" letter-spacing="1">AI WRITER (CHATBOT)</text><text x="788" y="216" font-family="'JetBrains Mono','monospace'" font-size="21" fill="#0E7C66" text-anchor="middle" letter-spacing="1">AI CMO AGENT</text><line x1="540" y1="240" x2="540" y2="1086" stroke="#E4DFD4" stroke-width="2"/><line x1="94" y1="279" x2="110" y2="295" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="295" x2="110" y2="279" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="294" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Responds — waits for a prompt</text><polyline points="574,287 580,294 593,277" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="294" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Acts — perceive -&gt; decide -&gt; execute</text><line x1="94" y1="363" x2="110" y2="379" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="379" x2="110" y2="363" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="378" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Stateless — forgets you</text><polyline points="574,371 580,378 593,361" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="378" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Remembers brand, funnel, campaigns</text><line x1="94" y1="447" x2="110" y2="463" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="463" x2="110" y2="447" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="462" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Single prompt, single reply</text><polyline points="574,455 580,462 593,445" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="462" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Orchestrated multi-step workflow</text><line x1="94" y1="531" x2="110" y2="547" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="547" x2="110" y2="531" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="546" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Generates text on a screen</text><polyline points="574,539 580,546 593,529" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="546" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Takes action across your channels</text><line x1="94" y1="615" x2="110" y2="631" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="631" x2="110" y2="615" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="630" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Guesses from what you paste</text><polyline points="574,623 580,630 593,613" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="630" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Reads your real numbers (MCP)</text><line x1="94" y1="699" x2="110" y2="715" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="715" x2="110" y2="699" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="714" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">No feedback loop</text><polyline points="574,707 580,714 593,697" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="714" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Evaluates results, self-corrects</text><line x1="94" y1="783" x2="110" y2="799" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="799" x2="110" y2="783" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="798" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Static until you re-prompt</text><polyline points="574,791 580,798 593,781" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="798" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Compounds with every campaign</text><rect x="70" y="1110" width="940" height="120" rx="16" fill="#EAF3EF" stroke="#0E7C66" stroke-width="1.5" filter="url(#cs)"/><text x="540" y="1158" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#0E7C66" text-anchor="middle">The chatbot isn't the enemy.</text><text x="540" y="1196" font-family="'Inter','sans-serif'" font-size="20" fill="#46535F" text-anchor="middle">An AI CMO contains a writer — then adds memory, tools and evaluation.</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@eric-sandhu</text></svg>