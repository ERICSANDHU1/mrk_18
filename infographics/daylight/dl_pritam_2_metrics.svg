-serif'" font-weight="700" font-size="22" fill="#1B2430">Qualified pipeline</text><line x1="94" y1="363" x2="110" y2="379" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="379" x2="110" y2="363" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="378" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Followers</text><polyline points="574,371 580,378 593,361" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="378" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Activated users</text><line x1="94" y1="447" x2="110" y2="463" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="463" x2="110" y2="447" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="462" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Click-through rate</text><polyline points="574,455 580,462 593,445" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="462" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">CAC payback period</text><line x1="94" y1="531" x2="110" y2="547" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="547" x2="110" y2="531" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text x="128" y="546" font-family="'Inter','sans-serif'" font-size="22" fill="#6B7682">Email open rate</text><polyline points="574,539 580,546 593,529" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="546" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Revenue per send</text><line x1="94" y1="615" x2="110" y2="631" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="631" x2="110" y2="615" stroke="#C0453B" stroke-width="3" stroke-linecap="round"/><text 