<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="44" fill="#1B2430" letter-spacing="-1">How an AI CMO Remembers Your Brand</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">Four memories, plus the engine that keeps them current.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><rect x="60" y="210" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="300" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">01</text><text x="210" y="244" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Working Memory</text><text x="210" y="276" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">The live scratchpad — this session's context.</text><text x="210" y="306" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">task in -&gt; reason -&gt; act -&gt; discard</text><rect x="60" y="356" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="446" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">02</text><text x="210" y="390" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Semantic — what your brand IS</text><text x="210" y="422" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Durable facts: positioning, ICP, tone, pricing.</text><text x="210" y="452" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">retrieve by relevance -&gt; grounds output</text><rect x="60" y="503" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="593" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">03</text><text x="210" y="537" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Episodic — what HAPPENED</text><text x="210" y="569" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Past campaigns and results: what won, what leaked.</text><text x="210" y="599" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">retrieve by recency -&gt; 'tried this before'</text><rect x="60" y="650" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="740" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">04</text><text x="210" y="684" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Procedural — how to DO the work</text><text x="210" y="716" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Marketing playbooks the agent runs step by step.</text><text x="210" y="746" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">match goal -&gt; run the recipe</text><rect x="60" y="797" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="887" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">05</text><text x="210" y="831" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Retrieval Layer (RAG)</text><text x="210" y="863" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Fetches the right memory at the right time.</text><text x="210" y="893" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">query -&gt; embed -&gt; search -&gt; inject</text><rect x="60" y="944" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="1034" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">06</text><text x="210" y="978" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Consolidation / Write-back</text><text x="210" y="1010" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Turns each run into new long-term memory.</text><text x="210" y="1040" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">session ends -&gt; summarize -&gt; persist</text><rect x="60" y="1091" width="960" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="1181" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">07</text><text x="210" y="1125" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Forgetting / Decay</text><text x="210" y="1157" font-family="'Inter','sans-serif'" font-size="18" fill="#6B7682">Prunes stale or contradicted facts.</text><text x="210" y="1187" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66">age / conflict -&gt; prune or refresh</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@eric-sandhu</text></svg>