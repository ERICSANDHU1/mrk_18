<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="50" fill="#1B2430" letter-spacing="-1">What Your AI CMO Watches</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">Five signals and the leaks between them — checked weekly.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><rect x="60" y="212" width="960" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="313" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">01</text><text x="210" y="285" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Channels</text><text x="210" y="321" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Where attention and customers actually come from.</text><rect x="60" y="383" width="960" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="484" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">02</text><text x="210" y="456" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Spend &amp; CAC</text><text x="210" y="492" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">What each customer costs — and whether it's creeping up.</text><rect x="60" y="554" width="960" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="655" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">03</text><text x="210" y="627" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Signups</text><text x="210" y="663" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Top-of-funnel volume — and how qualified it really is.</text><rect x="60" y="725" width="960" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="826" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">04</text><text x="210" y="798" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Activation</text><text x="210" y="834" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">How many new users reach real value, not just sign up.</text><rect x="60" y="896" width="960" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><text x="96" y="997" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#E7E2D6">05</text><text x="210" y="969" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Retention</text><text x="210" y="1005" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Who stays, who churns — the leak that kills growth.</text><rect x="60" y="1067" width="960" height="159" rx="14" fill="#EAF3EF" stroke="#0E7C66" stroke-width="2" filter="url(#cs)"/><text x="96" y="1168" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#CFE4DC">+</text><text x="210" y="1140" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">The leaks between them</text><text x="210" y="1176" font-family="'Inter','sans-serif'" font-size="20" fill="#46535F">Where money drains as people fall through the cracks.</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@mrk18hq</text></svg>