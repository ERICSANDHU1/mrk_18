<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="50" fill="#1B2430" letter-spacing="-1">The Founder Marketing Stack</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">Every layer you run before there's a team to run it.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><rect x="70" y="212" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="280" r="30" fill="#0E7C66"/><text x="132" y="290" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">1</text><text x="196" y="274" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Positioning</text><text x="196" y="310" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Who it's for, what it replaces, why it's better.</text><rect x="70" y="358" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="426" r="30" fill="#0E7C66"/><text x="132" y="436" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">2</text><text x="196" y="420" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Channels</text><text x="196" y="456" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">The 1–2 places your buyers actually are.</text><rect x="70" y="505" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="573" r="30" fill="#0E7C66"/><text x="132" y="583" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">3</text><text x="196" y="567" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Content / Offer</text><text x="196" y="603" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">The message and proof that makes a stranger care.</text><rect x="70" y="651" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="719" r="30" fill="#0E7C66"/><text x="132" y="729" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">4</text><text x="196" y="713" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Distribution</text><text x="196" y="749" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Getting it in front of people, repeatedly.</text><rect x="70" y="798" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="866" r="30" fill="#0E7C66"/><text x="132" y="876" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">5</text><text x="196" y="860" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Conversion</text><text x="196" y="896" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Attention -&gt; signups -&gt; paying customers.</text><rect x="70" y="944" width="940" height="136" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="132" cy="1012" r="30" fill="#0E7C66"/><text x="132" y="1022" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">6</text><text x="196" y="1006" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Retention</text><text x="196" y="1042" font-family="'Inter','sans-serif'" font-size="20" fill="#6B7682">Keeping who you won — the real growth engine.</text><rect x="70" y="1091" width="940" height="136" rx="14" fill="#EAF3EF" stroke="#0E7C66" stroke-width="2" filter="url(#cs)"/><circle cx="132" cy="1159" r="30" fill="#1B2430"/><text x="132" y="1169" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">7</text><text x="196" y="1153" font-family="'Inter','sans-serif'" font-weight="700" font-size="29" fill="#1B2430">Measurement</text><text x="196" y="1189" font-family="'Inter','sans-serif'" font-size="20" fill="#46535F">The numbers under it all. Most founders skip this.</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@pritam-raj</text></svg>