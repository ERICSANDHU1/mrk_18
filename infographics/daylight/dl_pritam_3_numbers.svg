<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="40" fill="#1B2430" letter-spacing="-1">6 Numbers Every Founder Should Know Cold</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">Not to impress investors — to know if your growth works.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><rect x="70" y="210" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="289" r="30" fill="#0E7C66"/><text x="134" y="299" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">1</text><text x="192" y="281" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">CAC — Customer Acquisition Cost</text><text x="192" y="317" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">What you spend to win one new customer.</text><rect x="743.6" y="273" width="256.4" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="871.8" y="294" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">only meaningful next to LTV</text><rect x="70" y="381" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="460" r="30" fill="#0E7C66"/><text x="134" y="470" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">2</text><text x="192" y="452" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">LTV — Lifetime Value</text><text x="192" y="488" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">Profit one customer brings while they stay.</text><rect x="743.6" y="444" width="256.4" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="871.8" y="465" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">aim for 3× your CAC or more</text><rect x="70" y="552" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="631" r="30" fill="#0E7C66"/><text x="134" y="641" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">3</text><text x="192" y="623" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">LTV : CAC Ratio</text><text x="192" y="659" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">Is a customer worth more than they cost?</text><rect x="743.6" y="615" width="256.4" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="871.8" y="636" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">3:1 minimum, 5:1+ efficient</text><rect x="70" y="724" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="803" r="30" fill="#0E7C66"/><text x="134" y="813" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">4</text><text x="192" y="795" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">CAC Payback Period</text><text x="192" y="831" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">Months of revenue to earn acquisition back.</text><rect x="725.2" y="787" width="274.79999999999995" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="862.6" y="808" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">under 12 months is the target</text><rect x="70" y="895" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="974" r="30" fill="#0E7C66"/><text x="134" y="984" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">5</text><text x="192" y="966" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">Activation Rate</text><text x="192" y="1002" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">% of signups who hit the aha moment.</text><rect x="844.8" y="958" width="155.2" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="922.4" y="979" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">40–60% is strong</text><rect x="70" y="1066" width="940" height="159" rx="14" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="134" cy="1145" r="30" fill="#0E7C66"/><text x="134" y="1155" font-family="'Inter','sans-serif'" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">6</text><text x="192" y="1137" font-family="'Inter','sans-serif'" font-weight="700" font-size="27" fill="#1B2430">Churn Rate</text><text x="192" y="1173" font-family="'Inter','sans-serif'" font-size="19" fill="#6B7682">% who leave each period — the leaky bucket.</text><rect x="771.2" y="1129" width="228.79999999999998" height="32" rx="16" fill="#E1EFEA" stroke="#0E7C66" stroke-width="1"/><text x="885.6" y="1150" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle">healthy SaaS &lt; 3–5% / mo</text><text x="80" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — your AI CMO</text><line x1="985" y1="1303" x2="1000" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="992" y2="1288" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><line x1="1000" y1="1288" x2="1000" y2="1296" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round"/><text x="978" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end"> · save this</text><text x="849" y="1300" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@pritam-raj</text></svg>