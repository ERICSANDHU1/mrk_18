<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf2fb"/>
      <stop offset="32%" stop-color="#c7dbef"/>
      <stop offset="62%" stop-color="#7ba6cc"/>
      <stop offset="100%" stop-color="#244c74"/>
    </linearGradient>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0d2c4a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- card container -->
  <rect x="20" y="20" width="1040" height="1310" rx="30" fill="url(#bg)" stroke="#cdddec" stroke-width="2"/>

  <!-- ===== ICEBERG ===== -->
  <!-- underwater body: faceted -->
  <g stroke="#0e2740" stroke-width="1.2" stroke-opacity="0.25" stroke-linejoin="round">
    <polygon points="470,250 540,250 540,580 330,580" fill="#33618f"/>
    <polygon points="540,250 610,250 750,580 540,580" fill="#1f405f"/>
    <polygon points="330,580 540,580 540,945 460,860" fill="#274d71"/>
    <polygon points="540,580 750,580 600,880 540,945" fill="#173049"/>
    <!-- sub facets -->
    <polygon points="470,250 540,250 430,470" fill="#3d6c9a" stroke-opacity="0.15"/>
    <polygon points="330,580 540,580 440,760" fill="#2b547d" stroke-opacity="0.15"/>
    <polygon points="540,580 750,580 645,760" fill="#15304a" stroke-opacity="0.15"/>
    <polygon points="430,470 540,400 540,580 330,580" fill="#2c5887" stroke-opacity="0.12"/>
    <polygon points="460,860 540,945 540,820" fill="#22466a" stroke-opacity="0.12"/>
  </g>

  <!-- waterline -->
  <line x1="40" y1="250" x2="1040" y2="250" stroke="#ffffff" stroke-width="2" stroke-dasharray="9 9" stroke-opacity="0.9"/>

  <!-- tip above water -->
  <polygon points="540,98 478,250 540,250" fill="#f4f8fc"/>
  <polygon points="540,98 602,250 540,250" fill="#dde9f4"/>

  <!-- waterline labels -->
  <text x="62" y="236" fill="#33557c" font-size="15" font-weight="bold" letter-spacing="3">WHAT THEY SEE</text>
  <text x="1018" y="278" fill="#ffffff" fill-opacity="0.92" font-size="15" font-weight="bold" letter-spacing="3" text-anchor="end">WHAT IT TAKES</text>

  <!-- ===== TIP CALLOUT ===== -->
  <line x1="612" y1="100" x2="548" y2="120" stroke="#5b7a9c" stroke-width="1.5"/>
  <g filter="url(#cardshadow)">
    <rect x="612" y="62" width="356" height="76" rx="12" fill="#ffffff"/>
  </g>
  <text x="634" y="96" fill="#16273b" font-size="22" font-weight="bold">The post</text>
  <text x="634" y="122" fill="#5d6e7e" font-size="15">The one polished thing your audience sees.</text>

  <!-- ===== CALLOUT CARDS ===== -->
  <!-- leader lines -->
  <line x1="408" y1="362" x2="472" y2="360" stroke="#7e98b3" stroke-width="1.5"/>
  <line x1="672" y1="500" x2="610" y2="500" stroke="#cdddec" stroke-width="1.5"/>
  <line x1="408" y1="632" x2="338" y2="630" stroke="#7e98b3" stroke-width="1.5"/>
  <line x1="672" y1="760" x2="612" y2="760" stroke="#cdddec" stroke-width="1.5"/>

  <!-- Card 1 -->
  <g filter="url(#cardshadow)">
    <rect x="58" y="312" width="350" height="128" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="92" cy="346" r="16" fill="#2f6db0"/>
  <text x="92" y="352" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">1</text>
  <text x="120" y="352" fill="#16273b" font-size="21" font-weight="bold">Strategy &amp; positioning</text>
  <text x="80" y="382" fill="#566776" font-size="14.5">The angle, hooks and messaging</text>
  <text x="80" y="403" fill="#566776" font-size="14.5">decided before a word is written.</text>
  <text x="80" y="426" fill="#93a2b1" font-size="11" font-style="italic">e.g. ICP, content pillars, brand voice, offer.</text>

  <!-- Card 2 -->
  <g filter="url(#cardshadow)">
    <rect x="672" y="452" width="350" height="128" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="706" cy="486" r="16" fill="#2f6db0"/>
  <text x="706" y="492" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">2</text>
  <text x="734" y="492" fill="#16273b" font-size="21" font-weight="bold">Market &amp; audience intel</text>
  <text x="694" y="522" fill="#566776" font-size="14.5">Competitor scans and trend</text>
  <text x="694" y="543" fill="#566776" font-size="14.5">signals on what to say now.</text>
  <text x="694" y="566" fill="#93a2b1" font-size="11" font-style="italic">e.g. competitor watch, trend radar, ICP research.</text>

  <!-- Card 3 -->
  <g filter="url(#cardshadow)">
    <rect x="58" y="582" width="350" height="128" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="92" cy="616" r="16" fill="#2f6db0"/>
  <text x="92" y="622" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">3</text>
  <text x="120" y="622" fill="#16273b" font-size="21" font-weight="bold">Content production</text>
  <text x="80" y="652" fill="#566776" font-size="14.5">Copy, creatives and reels for</text>
  <text x="80" y="673" fill="#566776" font-size="14.5">every platform and language.</text>
  <text x="80" y="696" fill="#93a2b1" font-size="11" font-style="italic">e.g. posts, carousels, reels, Hinglish copy.</text>

  <!-- Card 4 -->
  <g filter="url(#cardshadow)">
    <rect x="672" y="712" width="350" height="128" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="706" cy="746" r="16" fill="#2f6db0"/>
  <text x="706" y="752" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">4</text>
  <text x="734" y="752" fill="#16273b" font-size="21" font-weight="bold">Distribution &amp; approvals</text>
  <text x="694" y="782" fill="#566776" font-size="14.5">Scheduling, review gates and</text>
  <text x="694" y="803" fill="#566776" font-size="14.5">multi-platform publishing.</text>
  <text x="694" y="826" fill="#93a2b1" font-size="11" font-style="italic">e.g. approve-then-publish across channels.</text>

  <!-- ===== TAGLINE ===== -->
  <text x="540" y="1196" fill="#ffffff" fill-opacity="0.9" font-size="26" text-anchor="middle">You can't scale what you can't see.</text>
  <text x="540" y="1238" fill="#ffffff" font-size="28" font-weight="bold" text-anchor="middle">mrk18 is the AI CMO that runs the 90% below the surface.</text>

  <!-- wordmark -->
  <text x="62" y="1300" fill="#ffffff" fill-opacity="0.82" font-size="22" font-weight="bold" letter-spacing="1">mrk18</text>
</svg>
