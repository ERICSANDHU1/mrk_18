<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="34%" r="84%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="52" fill="#1B2430" letter-spacing="-1">Anatomy of an AI Agent</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">Model + Harness — and the model is the swappable part.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><circle cx="300" cy="770" r="252" fill="#ECEADF" stroke="#E4DFD4" stroke-width="2"/><circle cx="300" cy="770" r="172" fill="#E6EFEA" stroke="#C4DBD2" stroke-width="2"/><circle cx="300" cy="770" r="102" fill="#EAF3EF" stroke="#0E7C66" stroke-width="2.5"/><text x="300" y="562" font-family="'JetBrains Mono','monospace'" font-size="21" fill="#0E7C66" text-anchor="middle" letter-spacing="2">THE HARNESS</text><text x="300" y="638" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#6B7682" text-anchor="middle">AGENT LOOP</text><text x="300" y="766" font-family="'Inter','sans-serif'" font-weight="700" font-size="30" fill="#1B2430" text-anchor="middle">THE MODEL</text><text x="300" y="800" font-family="'JetBrains Mono','monospace'" font-size="16" fill="#6B7682" text-anchor="middle">reasoning core</text><text x="300" y="1070" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#94A0AB" text-anchor="middle">you engineer the harness</text><line x1="556" y1="770" x2="532" y2="770" stroke="#0E7C66" stroke-width="3"/><path d="M556 762 L568 770 L556 778 Z" fill="#0E7C66"/><rect x="588" y="218" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="292" r="22" fill="#0E7C66"/><text x="630" y="300" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">1</text><text x="670" y="284" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Guardrails</text><text x="670" y="316" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">What it's allowed to do — limits &amp; sign-off.</text><rect x="588" y="378" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="452" r="22" fill="#0E7C66"/><text x="630" y="460" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">2</text><text x="670" y="444" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Skills / Playbooks</text><text x="670" y="476" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">Reusable procedures it can run.</text><rect x="588" y="538" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="612" r="22" fill="#0E7C66"/><text x="630" y="620" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">3</text><text x="670" y="604" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Tools / APIs</text><text x="670" y="636" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">Live links to data and actions.</text><rect x="588" y="699" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="773" r="22" fill="#0E7C66"/><text x="630" y="781" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">4</text><text x="670" y="765" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Memory</text><text x="670" y="797" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">So it doesn't start from zero each time.</text><rect x="588" y="859" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="933" r="22" fill="#0E7C66"/><text x="630" y="941" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">5</text><text x="670" y="925" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Evaluators</text><text x="670" y="957" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">Scores its own output; retries on failure.</text><rect x="588" y="1019" width="452" height="148" rx="16" fill="#FFFFFF" stroke="#E4DFD4" stroke-width="1.5" filter="url(#cs)"/><circle cx="630" cy="1093" r="22" fill="#0E7C66"/><text x="630" y="1101" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">6</text><text x="670" y="1085" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Orchestration</text><text x="670" y="1117" font-family="'Inter','sans-serif'" font-size="17.5" fill="#6B7682">Routes the steps; human vs auto.</text><line x1="80" y1="1248" x2="1000" y2="1248" stroke="#E4DFD4" stroke-width="1"/><text x="80" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">notes on building AI</text><text x="1000" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@eric-sandhu</text></svg>