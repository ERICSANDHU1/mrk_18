<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="30%" r="86%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1B2430"/><stop offset="60%" stop-color="#0E7C66"/><stop offset="100%" stop-color="#15A07E"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1B2430" flood-opacity="0.12"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><rect x="0" y="0" width="1080" height="10" fill="url(#topbar)"/><rect x="80" y="96" width="222.5" height="36" rx="18" fill="none" stroke="#0E7C66" stroke-width="1.4"/><text x="191.25" y="120" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#0E7C66" text-anchor="middle" letter-spacing="1">FOUNDER MARKETING</text><text x="80" y="210" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#1B2430" letter-spacing="-1">Green dashboards.</text><text x="80" y="268" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="54" fill="#1B2430" letter-spacing="-1">Empty bank accounts.</text><text x="80" y="356" font-family="'Inter','sans-serif'" font-size="25" fill="#46535F">I looked at how 11 early founders market.</text><text x="80" y="390" font-family="'Inter','sans-serif'" font-size="25" fill="#46535F">The metrics were up. The revenue wasn't.</text><rect x="80" y="442" width="920" height="124" rx="14" fill="#EAF3EF" stroke="#E4DFD4" stroke-width="1" filter="url(#cs)"/><rect x="80" y="442" width="7" height="124" rx="3" fill="#0E7C66"/><text x="114" y="494" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Activity is easy to grow.</text><text x="114" y="534" font-family="'Inter','sans-serif'" font-weight="700" font-size="26" fill="#1B2430">Revenue was always the only point.</text><text x="310" y="750" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#34A37E" letter-spacing="1">MARKETING ACTIVITY</text><rect x="310" y="960" width="50" height="60" rx="5" fill="#34A37E"/><rect x="388" y="930" width="50" height="90" rx="5" fill="#34A37E"/><rect x="466" y="900" width="50" height="120" rx="5" fill="#34A37E"/><rect x="544" y="870" width="50" height="150" rx="5" fill="#34A37E"/><rect x="622" y="835" width="50" height="185" rx="5" fill="#34A37E"/><rect x="700" y="805" width="50" height="215" rx="5" fill="#34A37E"/><line x1="300" y1="1020" x2="790" y2="1020" stroke="#6B7682" stroke-width="2"/><line x1="300" y1="976" x2="790" y2="976" stroke="#C0453B" stroke-width="3"/><circle cx="310" cy="976" r="4" fill="#C0453B"/><circle cx="388" cy="976" r="4" fill="#C0453B"/><circle cx="466" cy="976" r="4" fill="#C0453B"/><circle cx="544" cy="976" r="4" fill="#C0453B"/><circle cx="622" cy="976" r="4" fill="#C0453B"/><circle cx="700" cy="976" r="4" fill="#C0453B"/><text x="790" y="962" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#C0453B" text-anchor="end" letter-spacing="1">REVENUE</text><text x="790" y="1000" font-family="'JetBrains Mono','monospace'" font-size="15" fill="#C0453B" text-anchor="end">flat</text><line x1="80" y1="1238" x2="1000" y2="1238" stroke="#E4DFD4" stroke-width="1"/><circle cx="110" cy="1288" r="26" fill="#0E7C66"/><text x="110" y="1296" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">P</text><text x="150" y="1284" font-family="'Inter','sans-serif'" font-weight="700" font-size="22" fill="#1B2430">Pritam Raj</text><text x="150" y="1308" font-family="'JetBrains Mono','monospace'" font-size="14.5" fill="#94A0AB">Notes on founder marketing</text><text x="1000" y="1294" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@pritam-raj</text></svg>