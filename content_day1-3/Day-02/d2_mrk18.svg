<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="34%" r="84%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="104" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="52" fill="#1B2430" letter-spacing="-1">Activity vs Results</text><text x="80" y="148" font-family="'Inter','sans-serif'" font-size="26" fill="#6B7682">The two columns every founder should put side by side.</text><line x1="80" y1="174" x2="1000" y2="174" stroke="#0E7C66" stroke-width="2"/><text x="300" y="230" font-family="'JetBrains Mono','monospace'" font-size="20" fill="#6B7682" text-anchor="middle" letter-spacing="1">ACTIVITY · feels like progress</text><text x="784" y="230" font-family="'JetBrains Mono','monospace'" font-size="20" fill="#0E7C66" text-anchor="middle" letter-spacing="1">RESULTS · is progress</text><line x1="540" y1="256" x2="540" y2="1090" stroke="#E4DFD4" stroke-width="2"/><line x1="78" y1="323" x2="96" y2="323" stroke="#6B7682" stroke-width="3"/><text x="116" y="330" font-family="'Inter','sans-serif'" font-size="24" fill="#6B7682">Impressions</text><polyline points="566,323 572,330 582,318" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="330" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Qualified pipeline</text><line x1="78" y1="364" x2="1002" y2="364" stroke="#E4DFD4" stroke-width="1"/><line x1="78" y1="443" x2="96" y2="443" stroke="#6B7682" stroke-width="3"/><text x="116" y="450" font-family="'Inter','sans-serif'" font-size="24" fill="#6B7682">Clicks &amp; reach</text><polyline points="566,443 572,450 582,438" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="450" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Signups</text><line x1="78" y1="484" x2="1002" y2="484" stroke="#E4DFD4" stroke-width="1"/><line x1="78" y1="563" x2="96" y2="563" stroke="#6B7682" stroke-width="3"/><text x="116" y="570" font-family="'Inter','sans-serif'" font-size="24" fill="#6B7682">Posts shipped</text><polyline points="566,563 572,570 582,558" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="570" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Activation (real value)</text><line x1="78" y1="604" x2="1002" y2="604" stroke="#E4DFD4" stroke-width="1"/><line x1="78" y1="683" x2="96" y2="683" stroke="#6B7682" stroke-width="3"/><text x="116" y="690" font-family="'Inter','sans-serif'" font-size="24" fill="#6B7682">Open rates</text><polyline points="566,683 572,690 582,678" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="690" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Retention</text><line x1="78" y1="724" x2="1002" y2="724" stroke="#E4DFD4" stroke-width="1"/><line x1="78" y1="803" x2="96" y2="803" stroke="#6B7682" stroke-width="3"/><text x="116" y="810" font-family="'Inter','sans-serif'" font-size="24" fill="#6B7682">Followers</text><polyline points="566,803 572,810 582,798" fill="none" stroke="#0E7C66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="810" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#1B2430">Revenue</text><line x1="78" y1="844" x2="1002" y2="844" stroke="#E4DFD4" stroke-width="1"/><rect x="70" y="990" width="940" height="120" rx="16" fill="#EAF3EF" stroke="#0E7C66" stroke-width="1.5" filter="url(#cs)"/><text x="540" y="1036" font-family="'Inter','sans-serif'" font-weight="700" font-size="24" fill="#0E7C66" text-anchor="middle">For every number you track, ask one thing:</text><text x="540" y="1074" font-family="'Inter','sans-serif'" font-size="21" fill="#46535F" text-anchor="middle">is this activity — or the result it's supposed to create?</text><line x1="80" y1="1248" x2="1000" y2="1248" stroke="#E4DFD4" stroke-width="1"/><text x="80" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">mrk18 — the AI CMO domain</text><text x="1000" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@mrk18hq</text></svg>