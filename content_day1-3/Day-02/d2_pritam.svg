<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="34%" r="84%"><stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F4F1EA"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.05"/></pattern><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1B2430" flood-opacity="0.10"/></filter></defs><rect width="1080" height="1350" fill="#F4F1EA"/><rect width="1080" height="1350" fill="url(#vig)"/><rect width="1080" height="1350" fill="url(#grid)"/><text x="80" y="116" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" letter-spacing="1">PRITAM · NOTES ON FOUNDER MARKETING</text><text x="1000" y="116" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB" text-anchor="end">DAY 02</text><line x1="80" y1="140" x2="1000" y2="140" stroke="#E4DFD4" stroke-width="1"/><circle cx="120" cy="270" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="138" cy="310" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="112" cy="328" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="150" cy="288" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="130" cy="260" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="160" cy="320" r="6" fill="#6B7682" fill-opacity="0.5"/><circle cx="224" cy="300" r="30" fill="none" stroke="#0E7C66" stroke-width="2.5"/><circle cx="224" cy="300" r="9" fill="#0E7C66"/><line x1="246" y1="322" x2="264" y2="340" stroke="#0E7C66" stroke-width="4" stroke-linecap="round"/><text x="80" y="470" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="62" fill="#1B2430" letter-spacing="-1">More tactics won't</text><text x="80" y="538" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="62" fill="#1B2430" letter-spacing="-1">help. A second opinion</text><text x="80" y="606" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="62" fill="#1B2430" letter-spacing="-1">will.</text><line x1="80" y1="678" x2="300" y2="678" stroke="#0E7C66" stroke-width="3"/><text x="80" y="728" font-family="'Inter','sans-serif'" font-size="25" fill="#46535F">Founders aren't short on ideas. They're short on an</text><text x="80" y="761" font-family="'Inter','sans-serif'" font-size="25" fill="#46535F">honest read of the ideas they have.</text><text x="1012" y="1170" font-family="'Inter ExtraBold','Inter',sans-serif" font-weight="800" font-size="300" fill="none" stroke="#0E7C66" stroke-width="2" stroke-opacity="0.10" text-anchor="end">02</text><line x1="80" y1="1248" x2="1000" y2="1248" stroke="#E4DFD4" stroke-width="1"/><text x="80" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#94A0AB">notes on founder marketing</text><text x="1000" y="1292" font-family="'JetBrains Mono','monospace'" font-size="18" fill="#0E7C66" text-anchor="end">@pritam-raj</text></svg>