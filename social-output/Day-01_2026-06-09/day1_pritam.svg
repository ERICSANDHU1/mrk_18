<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowP" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="#07090a"/>
  <ellipse cx="540" cy="420" rx="560" ry="380" fill="url(#glowP)"/>

  <!-- eyebrow -->
  <text x="80" y="92" font-family="'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="3" fill="#00ff88">● BUILDING IN PUBLIC — DAY 01</text>
  <text x="1000" y="92" font-family="'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#eef2ee" text-anchor="end" letter-spacing="1">mrk18</text>

  <!-- dashboard card -->
  <rect x="80" y="150" width="920" height="470" rx="24" fill="#0e1512" stroke="#1d2b24" stroke-width="2"/>
  <text x="124" y="212" font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#6f7d74">your-startup  ·  marketing  ·  last 30 days</text>

  <line x1="124" y1="240" x2="956" y2="240" stroke="#1d2b24" stroke-width="1.5"/>

  <!-- rows -->
  <text x="124" y="300" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#cdd6d0">Impressions</text>
  <text x="956" y="300" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88" text-anchor="end">▲  312%</text>
  <line x1="124" y1="328" x2="956" y2="328" stroke="#141f1a" stroke-width="1.5"/>

  <text x="124" y="384" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#cdd6d0">Clicks</text>
  <text x="956" y="384" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88" text-anchor="end">▲  4,120</text>
  <line x1="124" y1="412" x2="956" y2="412" stroke="#141f1a" stroke-width="1.5"/>

  <text x="124" y="468" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#cdd6d0">Click-through rate</text>
  <text x="956" y="468" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88" text-anchor="end">▲  2.8%</text>
  <line x1="124" y1="496" x2="956" y2="496" stroke="#141f1a" stroke-width="1.5"/>

  <text x="124" y="552" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#9aa69e">Paying customers</text>
  <text x="956" y="552" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#ffb000" text-anchor="end">2</text>

  <!-- stark word -->
  <text x="76" y="828" font-family="'DejaVu Sans', sans-serif" font-size="150" font-weight="bold" letter-spacing="-3" fill="#eef2ee">Silence<tspan fill="#00ff88">.</tspan></text>

  <!-- subhook -->
  <text x="80" y="905" font-family="'DejaVu Sans', sans-serif" font-size="36" fill="#aab4ae">A dashboard full of green.</text>
  <text x="80" y="953" font-family="'DejaVu Sans', sans-serif" font-size="36" fill="#aab4ae">A bank account that disagrees.</text>

  <!-- accent -->
  <text x="80" y="1035" font-family="'DejaVu Sans Mono', monospace" font-size="25" fill="#00ff88" fill-opacity="0.9">11 founders. Same story in 3 weeks.</text>

  <!-- footer -->
  <line x1="80" y1="1250" x2="1000" y2="1250" stroke="#1d2b24" stroke-width="1.5"/>
  <text x="80" y="1295" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#6f7d74">@pritam-raj  ·  THE FIELD</text>
  <text x="1000" y="1295" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#6f7d74" text-anchor="end">mrk18 — your AI CMO</text>
