<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowM" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="#07090a"/>
  <ellipse cx="540" cy="500" rx="600" ry="420" fill="url(#glowM)"/>

  <!-- watermark -->
  <text x="540" y="330" font-family="'DejaVu Sans', sans-serif" font-size="210" font-weight="bold" fill="#00ff88" fill-opacity="0.05" text-anchor="middle" letter-spacing="6">DAY 01</text>

  <!-- eyebrow -->
  <text x="80" y="100" font-family="'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="3" fill="#00ff88">● BUILDING IN PUBLIC — DAY 01</text>

  <!-- headline -->
  <text x="80" y="210" font-family="'DejaVu Sans', sans-serif" font-size="46" font-weight="bold" fill="#eef2ee">Two founders.</text>
  <text x="80" y="262" font-family="'DejaVu Sans', sans-serif" font-size="46" font-weight="bold" fill="#eef2ee">Building in the open.</text>

  <!-- split panel -->
  <rect x="80" y="310" width="920" height="350" rx="24" fill="#0e1512" stroke="#1d2b24" stroke-width="2"/>
  <line x1="540" y1="338" x2="540" y2="632" stroke="#1d2b24" stroke-width="2"/>

  <!-- left: dashboard -->
  <text x="124" y="372" font-family="'DejaVu Sans Mono', monospace" font-size="20" letter-spacing="1" fill="#6f7d74">THE DASHBOARD</text>
  <text x="124" y="440" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88">▲ Impressions</text>
  <text x="124" y="500" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88">▲ Clicks</text>
  <text x="124" y="560" font-family="'DejaVu Sans Mono', monospace" font-size="30" fill="#00ff88">▲ Reach</text>
  <text x="124" y="620" font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#6f7d74">all green.</text>

  <!-- right: bank -->
  <text x="584" y="372" font-family="'DejaVu Sans Mono', monospace" font-size="20" letter-spacing="1" fill="#6f7d74">THE BANK</text>
  <text x="584" y="470" font-family="'DejaVu Sans Mono', monospace" font-size="26" fill="#9aa69e">Paying customers</text>
  <text x="584" y="585" font-family="'DejaVu Sans', sans-serif" font-size="120" font-weight="bold" fill="#ffb000">2</text>
  <text x="584" y="620" font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#6f7d74">silence.</text>

  <!-- stark -->
  <text x="540" y="788" font-family="'DejaVu Sans', sans-serif" font-size="74" font-weight="bold" fill="#eef2ee" text-anchor="middle" letter-spacing="-1">Green ≠ growth.</text>

  <!-- subline -->
  <text x="540" y="868" font-family="'DejaVu Sans', sans-serif" font-size="31" fill="#aab4ae" text-anchor="middle">An AI CMO for founders running marketing</text>
  <text x="540" y="908" font-family="'DejaVu Sans', sans-serif" font-size="31" fill="#aab4ae" text-anchor="middle">without a marketing team. India-first.</text>

  <!-- wordmark -->
  <text x="548" y="1085" font-family="'DejaVu Sans', sans-serif" font-size="130" font-weight="bold" fill="#eef2ee" text-anchor="end">mrk</text>
  <text x="552" y="1085" font-family="'DejaVu Sans', sans-serif" font-size="130" font-weight="bold" fill="#00ff88" text-anchor="start">18</text>
  <text x="540" y="1145" font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#00ff88" text-anchor="middle" letter-spacing="2">WATCH US BUILD IT</text>

  <!-- footer -->
  <line x1="80" y1="1255" x2="1000" y2="1255" stroke="#1d2b24" stroke-width="1.5"/>
  <text x="80" y="1300" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#6f7d74">Eric builds it.</text>
  <text x="1000" y="1300" font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#6f7d74" text-anchor="end">Pritam talks to founders.</text>
</svg>
