[project]
name = "mrk18-execution"
version = "0.1.0"
description = "MRK18 Execution System — the engines the Brain commands. Brain thinks & commands; engines execute."
requires-python = ">=3.11"
dependencies = [
    # Core pipeline (versions verified 11 Jun 2026 — see SYSTEM_ARCHITECTURE.md §5)
    "langgraph~=1.2",
    "langgraph-checkpoint-postgres~=3.1",
    "psycopg[binary,pool]~=3.2",
    "pydantic~=2.7",
    "pydantic-settings~=2.3",
    # API
    "fastapi~=0.115",
    "uvicorn[standard]~=0.30",
    "sse-starlette~=2.1",
    # Database (Supabase Postgres — session pooler, port 5432 only)
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.29",
    "supabase~=2.31",          # Storage uploads + Auth admin ONLY (not data access)
    # LLM providers (OpenAI-compatible clients — Together / Groq / later vLLM)
    "openai~=1.35",
    # Images
    "fal-client~=0.5",
    "pillow~=10.4",
    # Auth validation + token vault crypto
    "pyjwt[crypto]~=2.8",
    "cryptography>=42",
    # Utilities
    "httpx~=0.27",
    "tenacity~=8.4",
    # CMO call voice — free Microsoft neural TTS (en-IN male); Groq Orpheus is the fallback
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2",
    "pytest-asyncio~=0.23",
    "pytest-cov~=5.0",
    "ruff~=0.5",
    "aiosqlite~=0.20",
]
# Background worker (C3) — ARQ on Redis. Optional so the API never needs Redis to boot.
worker = [
    "arq~=0.26",
]
# Observability (C4) — Sentry is optional; absent DSN (or absent package) = no-op.
observability = [
    "sentry-sdk[fastapi]~=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mrk18_execution"]
# the worker needs Redis + the deploy entrypoint needs a process — both run only
# in deployment, so they're excluded from the unit-coverage gate.
omit = [
    "mrk18_execution/worker/*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrk18_execution*"]
